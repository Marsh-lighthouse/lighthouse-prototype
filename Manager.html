<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lighthouse — Manager</title>
<script>try{localStorage.removeItem('lh-theme');}catch(e){}</script>
<link rel="stylesheet" href="brand.css" />
<link rel="stylesheet" href="client-brand.css" />
<link rel="stylesheet" href="dark-theme.css" />
<script src="client-brand.js"></script>

<style>
  html, body { margin: 0; background: var(--canvas); }
  #root { min-height: 100vh; }
  .lh-back { position: fixed; right: 58px; bottom: 14px; z-index: 60; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.72); color: #7B7974; text-decoration: none; font-family: var(--sans); font-size: 14px; font-weight: 500; letter-spacing: .01em; padding: 6px 11px; border-radius: 8px; border: 1px solid rgba(0,15,71,.12); box-shadow: 0 2px 8px rgba(0,15,71,.06); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: .5; transition: opacity .15s ease, color .15s ease, background .15s ease; }
  .lh-back:hover { opacity: 1; color: #000F47; background: #fff; }
  .lh-brand-switch { right: 300px; }
  :root { --fol-mx: auto; }
  .ed-pageback { display: none !important; }
  @keyframes ed-spin { to { transform: rotate(360deg); } }
  .ed-spin { animation: ed-spin .7s linear infinite; }
  @keyframes idp-blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  /* team rows: shed the skills/actions column before anything wraps */
  @media (max-width: 1180px) { .mgr-counts { display: none; } }
</style>
<link rel="stylesheet" href="device-preview.css" />
<script>try{var __d=localStorage.getItem('lh-device');if(__d&&__d!=='Desktop')document.documentElement.setAttribute('data-device',__d.toLowerCase());}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<a class="lh-back" href="Lighthouse.html">&#8592; All directions</a>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
