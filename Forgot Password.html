<script>
function applyForgotPasswordTranslation(lang = 'en') {
  const T = window.LOGIN_TRANSLATIONS;
  if (!T) return;
  const t = (key) => T[lang]?.[key] || T.en[key] || key;
  const labels = document.querySelectorAll('label');
  if (labels[0]) labels[0].textContent = t('Email');
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
}
window.addEventListener('lh-language-changed', (e) => applyForgotPasswordTranslation(e.detail.lang));
setTimeout(() => applyForgotPasswordTranslation(localStorage.getItem('lh-language') || 'en'), 100);
</script>
<style>
  html, body { margin: 0; height: 100%; background: var(--canvas); }
  body { font-family: var(--sans); color: var(--ink); }

  .lg-split { display: flex; min-height: 100vh; }

  .lg-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 8px; color: var(--muted); cursor: pointer; transition: color .15s ease, background .15s ease; }

  .lg-row-between { display: flex; align-items: center; justify-content: flex-end; margin: -6px 0 24px; }
  .lg-link { font-size: 14px; font-weight: 600; color: var(--primary); text-decoration: none; }
  .lg-link:hover { text-decoration: underline; }

  .lg-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--primary); background: var(--action); border: none; border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: filter .15s ease, transform .1s ease; }
  .lg-btn:hover { filter: brightness(.96); }
  .lg-btn:active { transform: translateY(1px); }
  .lg-btn[disabled] { cursor: default; filter: saturate(.7) brightness(1.02); }

  .lg-spinner { width: 16px; height: 16px; border: 2px solid rgba(0,15,71,.25); border-top-color: var(--primary); border-radius: 50%; display: none; animation: lg-spin .7s linear infinite; }
  @keyframes lg-spin { to { transform: rotate(360deg); } }

  .lg-signup { margin: 26px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

  /* Footer + co-brand styles live in login-styles.css (shared) */

  /* ── Right: feature image panel ── */
  .lg-feature { flex: 1 1 65%; min-width: 0; position: relative; background: var(--primary); overflow: hidden; }
  .lg-feature-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 920px) {
    .lg-feature { display: none; }
    .lg-form-panel { padding: 32px 28px 24px; }

  .lh-back { position: fixed; right: 58px; bottom: 14px; z-index: 60; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.72); color: var(--muted); text-decoration: none; font-family: var(--sans); font-size: 14px; font-weight: 500; letter-spacing: .01em; padding: 6px 11px; border-radius: 8px; border: 1px solid rgba(0,15,71,.12); box-shadow: 0 2px 8px rgba(0,15,71,.06); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: .5; transition: opacity .15s ease, color .15s ease, background .15s ease; }

  .lg-lang-switcher { position: fixed; top: 28px; right: 28px; z-index: 100; font-family: var(--sans); }
  html[dir="rtl"] .lg-lang-switcher { right: auto; left: 28px; }

  /* Switcher sits on the cream form panel — dark-on-light for WCAG AA (matches Login / Sign Up). */
  .lg-lang-btn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.9); color: var(--primary); border: 1px solid rgba(0,15,71,.15); border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .lg-lang-btn:hover { background: #fff; border-color: rgba(0,15,71,.28); }

  .lg-lang-dropdown { display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; background: #fff; border: 1px solid rgba(0,15,71,.15); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,15,71,.12); overflow: hidden; min-width: 140px; }
  html[dir="rtl"] .lg-lang-dropdown { right: auto; left: 0; }

<script>
  (function () {
    var form = document.getElementById("lg-form");
    var submit = document.getElementById("lg-submit");
    var label = document.getElementById("lg-btn-label");
    var spinner = document.getElementById("lg-spinner");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      label.textContent = "Sending link…";
      spinner.style.display = "block";
      setTimeout(function () {
        spinner.style.display = "none";
        label.textContent = "Link sent";
        document.getElementById("lg-sent").hidden = false;
      }, 1100);
    });
  })();
</script>
